name: smoke-viz-keepalive
profile: python
# Provider config is injected by tools/smoke_provider.py (BR-10.2: only the
# active provider's block may exist). This template deliberately carries no
# provider/llm/claude/copilot block.
agents_dir: agents
additional_files: []
deps_policy: open
max_attempts: 3
steps:
  - name: deps
    command: python -m venv .venv-sandbox && .venv-sandbox/bin/pip install -e ".[dev]"
    timeout: 900
    mounts: [{path: ".", mode: rw}]
    network: true
    egress: {presets: [package-registries]}
    on_pass: dev
  - name: dev
    agent: dev
    max_iterations: 60
    finalize_nudge_turns: 5
    produces: implementation-summary.md
    mounts: [{path: ".", mode: rw}]
    forbidden_commands:
      - '\btools/publish\.py\b'
      - '\btwine\s+upload\b'
      - '\bgh\s+release\s+create\b'
      - '\bgh\s+pr\s+(create|merge|close)\b'
      - pip install
      - uv add
      - pip-compile
    on_pass: test
  - name: test
    command: .venv-sandbox/bin/python -m pytest tests/test_055_cli.py -q -m "not docker" -k keepalive
    timeout: 300
    mounts: [{path: ".", mode: rw}]
    on_pass: success
    on_fail: {goto: dev, retry: true}
