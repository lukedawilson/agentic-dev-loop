name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + PBT (no Docker)
        run: pytest tests/ -m "not docker" -q
      - name: Prepare integration image
        run: docker pull python:3.12
      - name: Docker integration tests
        run: pytest tests/ -m docker -q
