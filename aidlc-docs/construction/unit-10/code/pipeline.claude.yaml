# Unit 10 live-gate scratch pipeline (documentation, not application code).
# Copy this file into a scratch workspace with the three agent files from
# agentic-dev-loop/sdk_agents/ and run it with a real claude login.
# No llm-family keys: they are forbidden when provider is not openhands.
name: unit-10-claude-smoke
agents_dir: sdk_agents
provider: claude
claude:
  login: subscription
  model: sonnet
  max_turns: 30
deps_policy: open
max_attempts: 2
steps:
  - name: dev
    agent: dev
    produces: implementation-summary.md
    terminal_timeout: 120
    on_pass: test
  - name: test
    command: python -m pytest -q
    timeout: 300
    on_pass: review
    on_fail: { goto: dev, retry: true }
  - name: review
    agent: review
    artifact: review-findings.md
    verdicts: { pass: APPROVED, fail: NEEDS CHANGES }
    on_pass: success
    on_fail: { goto: dev, retry: true }
