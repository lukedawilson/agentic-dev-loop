<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentic-dev-loop viz</title>
<link rel="stylesheet" href="styles.css">
<script src="pipeline-layout.js"></script>
</head>
<body>
<a class="skip" href="#stages">Skip to stages</a>
<header class="hdr">
  <div class="hdr-brand"><span class="mark" aria-hidden="true"></span>
    <span class="hdr-name">agentic-dev-loop viz</span></div>
  <div class="hdr-right">
    <span id="stream" class="stream" role="status"><span class="led" aria-hidden="true"></span>
      <span id="stream-label">STREAM LIVE</span></span>
    <button id="theme-toggle" class="hdr-action" type="button"
            data-testid="theme-toggle" aria-label="Switch to light theme">
      <span id="theme-icon" class="ic" aria-hidden="true">
        <svg class="ic-sun" viewBox="0 0 16 16" width="16" height="16" fill="none">
          <circle cx="8" cy="8" r="3.33" fill="currentColor"/>
          <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                d="M8 .67v2M8 13.33v2M.67 8h2M13.33 8h2M2.81 2.81l.95.95M12.24 12.24l.95.95M13.19 2.81l-.95.95M3.76 12.24l-.95.95"/>
        </svg>
        <svg class="ic-moon" viewBox="0 0 16 16" width="16" height="16">
          <path d="M14 8.53A6 6 0 1 1 7.47 2 4.67 4.67 0 0 0 14 8.53Z" fill="currentColor"/>
        </svg>
      </span>
    </button>
  </div>
</header>
<div id="stream-banner" role="status" aria-live="polite" data-testid="stream-banner"></div>
<main class="shell">
  <section class="tiles" aria-label="Run summary">
    <div class="tile"><div class="lbl">Run</div>
      <div id="subject" class="big">agentic-dev-loop pipeline</div></div>
    <div class="tile"><div class="lbl">Attempt</div>
      <div id="attempt" class="big">?/?</div><div id="meter" class="meter"></div></div>
    <div class="tile"><div class="lbl">Thread ID</div>
      <div id="thread" class="big"><code id="thread-id" tabindex="0" role="button" title="click to copy">--</code></div></div>
    <div class="tile"><div class="lbl">Total</div>
      <div id="total" class="big"></div></div>
  </section>
  <div id="verdicts" class="verdicts" aria-label="Step verdicts"></div>
  <div id="run-banner" class="outcome" role="status" aria-live="polite" data-testid="run-banner"></div>
  <section id="pipeline-panel" class="panel" aria-label="Pipeline">
    <div class="panel-h"><span>Pipeline</span>
      <span class="legend mono">solid = on_pass / dashed = on_fail</span></div>
    <div class="graph-wrap"><div id="graph" role="img" aria-label="Pipeline graph"></div></div>
  </section>
  <div class="lower">
    <section class="panel panel-stages" aria-label="Stages">
      <div class="panel-h"><span>Stages</span></div>
      <div id="stages"></div>
    </section>
    <section class="panel panel-log" aria-label="Event log">
      <div class="panel-h"><span>Event log</span></div>
      <ol id="run-log" data-testid="run-log"></ol>
    </section>
  </div>
</main>
<script src="page.js"></script>
</body>
</html>
