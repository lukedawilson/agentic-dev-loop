name: rust
placeholders:
  __CARGO_DIR__: DETECTED
brief_env_facts:
  - "the workspace is an export with no .git; verify with find/ls, never git status"
  - "the sandbox is network-off by default; never run package-manager fetches"
  - "the cargo registry cache lives in CARGO_HOME (.cargo-cache, bind-mounted); cargo build/check/test run offline against it, and cargo fetch runs only in the network-on restore step"
dev_impossible_set:
  - "package-manager fetches after a new pin run only in the network-on restore step"
  - "rustup toolchain installs or updates (the sandbox bakes one Rust toolchain)"
steps:
  - name: brief
    kind: brief
    brief_inputs: {include: [AGENTS.md]}
    forbidden_commands:
      - cargo add
      - cargo install
      - cargo update
      - rustup
    on_pass: dev
  - name: dev
    kind: agent
    agent: dev
    reasoning_effort: high
    max_iterations: 150
    finalize_nudge_turns: 10
    produces: implementation-summary.md
    forbidden_commands:
      - cargo add
      - cargo install
      - cargo update
      - rustup
    setup: 'cd __CARGO_DIR__ && cargo fetch'
    env: {CARGO_HOME: '{export}/.cargo-cache'}
    mounts: [{path: ".", mode: rw}]
    on_pass: restore
  - name: restore
    kind: command
    command: 'cd __CARGO_DIR__ && cargo fetch'
    timeout: 1800
    network: true
    egress: {presets: [package-registries]}
    env: {CARGO_HOME: '{export}/.cargo-cache'}
    mounts: [{path: ".", mode: rw}]
    on_pass: test
    on_fail: {goto: dev, retry: true}
  - name: test
    kind: command
    command: 'cd __CARGO_DIR__ && cargo test --locked --offline'
    timeout: 1800
    env: {CARGO_HOME: '{export}/.cargo-cache'}
    mounts: [{path: ".", mode: rw}]
    on_pass: review
    on_fail: {goto: dev, retry: true}
  - name: review
    kind: agent
    agent: review
    reasoning_effort: xhigh
    artifact: review-findings.md
    verdicts: {pass: APPROVED, fail: NEEDS CHANGES}
    mounts: [{path: ".", mode: ro}]
    forbidden_commands:
      - cargo add
      - cargo install
      - cargo update
      - rustup
    on_pass: qa
    on_fail: {goto: dev, retry: true}
  - name: qa
    kind: agent
    agent: qa
    reasoning_effort: medium
    artifact: qa-report.md
    verdicts: {pass: PASS, fail: FAIL, unverifiable: UNVERIFIABLE, env: ENV}
    max_iterations: 150
    finalize_nudge_turns: 10
    mounts: [{path: ".", mode: ro}]
    on_pass: commit
    on_fail: {goto: dev, retry: true}
    on_unverifiable: commit
  - {name: commit, kind: action, action: commit,
     params: {message: "feat: construct {subject} (agent dev loop)"}, on_pass: success}
