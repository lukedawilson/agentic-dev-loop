name: agentic-dev-loop-construction
profile: python   # 055: toolchain facts (image, cpus, gitignore) merge at load

extensions:
  - agentic_dev_loop.engine.extensions.aidlc:AidlcExtension   # bundled; loading IS choosing

additional_files:
  - ../README.md                                              # resolved relative to the pipeline file's dir;
                                                              # listed-but-missing → fail fast
  - ../docs/pipeline.md                                       # binding fixed policies (moved out of README)
  - ../coding-standards-ddd.yaml                              # resolved relative to pipeline file's dir
  - ../AGENTS.md                                              # (agentic-dev-loop/) → repo root
  - ../aidlc-docs/domain-model-erd.md                         # project domain model (aidlc-docs)
  - ../CHANGELOG.md                                           # release history for the code under change (unit-5 egress entries)
  - ../docs/known-issues.md                                   # known container-lifecycle issues touching isolation.py

llm:
  model: openai/deepseek-v4-pro
  base_url: https://api.deepseek.com
  api_key_env: OPENAI_API_KEY
  # timeout omitted → opinionated no-timeout default

# 054: named LLM profiles. A step names a profile with `llm: <name>` to move
# the whole profile (model, endpoint, key, effort default) together; the
# `llm:` block above stays the default. Profile keys are host-side: sandbox
# access still goes through `secrets:`, never a profile key.
# flash (DeepSeek-V4.1-Flash) is thinking-capable and the API reasons at its
# "high" default when no effort is sent, so every step naming this profile
# must set reasoning_effort (brief/dev do); otherwise the engine's D12
# passback error fires on the first multi-turn request. A step's own
# reasoning_effort overrides the profile's.
llms:
  flash:
    model: openai/deepseek-flash
    base_url: https://api.deepseek.com
    api_key_env: OPENAI_API_KEY
    reasoning_effort: medium

max_attempts: 10                     # CLI --max-attempts overrides
agents_dir: sdk_agents               # resolved relative to the pipeline file's dir
# Supply-chain dial: this repo's dogfood loop still runs the bootstrap
# protocol (its restore step is an open install; no committed lockfile yet -
# the consumer repos migrate to `locked` once a committed lockfile exists).
# `open` keeps the original restore behavior verbatim.
deps_policy: open
# Concurrent-edit merge: the aidlc audit log is append-only and edited by
# both the loop (AI-DLC mandates audit.md logging) and the operator - union-merge
# those edits instead of raising a sync-back conflict.
merge_on_conflict: [aidlc-docs/audit.md]
steps:
  - name: brief
    llm: flash
    reasoning_effort: medium
    # Per-run context digestion: a native brief step (049) - `brief_inputs:` is
    # the type discriminator, so there is no agent/produces/max_iterations.
    # The prompt, capture file, and iteration cap are engine-owned. The closed
    # input list (resolved relative to the workspace root) plus the stable
    # environment facts the brief agent must never discover by running
    # commands; the resolved unit/plan docs and additional_files (../README.md)
    # arrive through the loader context.
    brief_inputs:
      include: [AGENTS.md, coding-standards-ddd.yaml]
      # 046: single-source the digest headings - the coverage gate and the
      # embedded brief prompt both render from this list (neutral defaults).
      sections: [Repo rules digest, Unit scope digest, Environment facts, Open risks]
      env_facts:
        - the workspace is an export with no .git; verify with find/ls, never git status
        - the sandbox is network-off by default; never run package-manager fetches
        - Python packages resolve from .venv-sandbox; run .venv-sandbox/bin/python
    # Banned-command deny-list: custom entries append after the engine
    # defaults (git mutations, docker).
    # Releases and GitHub mutations stay operator-only: the loop never
    # publishes itself.
    forbidden_commands:
      - '\btools/publish\.py\b'
      - '\btwine\s+upload\b'
      - '\bgh\s+release\s+create\b'
      - '\bgh\s+pr\s+(create|merge|close)\b'
      - pip install
      - uv add
      - pip-compile
    on_pass: deps

  - name: deps
    command: python -m venv .venv-sandbox && .venv-sandbox/bin/pip install -e ".[dev]"
    timeout: 600
    mounts: [{ path: ".", mode: rw }]   # .venv-sandbox is a gitignored dir in the export
    network: true                    # one-time bootstrap fetch: PyPI
    egress: { presets: [package-registries] }
    # No on_fail: a committed manifest that cannot install is an operator
    # problem, so a failure here halts the run loudly.
    on_pass: dev

  - name: dev
    agent: dev
    llm: flash
    reasoning_effort: high
    max_iterations: 150        # 035: turn cap; hard outer bound against verification spirals
    finalize_nudge_turns: 10   # 035: one advisory "produce your final response now" turn at max_iterations - 10
    produces: implementation-summary.md   # hygiene-tracked, no verdict
    mounts: [{path: ".", mode: rw}]        # strict-by-default (Q4): declared, not implied
    # The audit escalation dev must read (065): a restore/pip-audit failure is
    # a required manifest edit, not a pre-existing issue to report past.
    custom_prompt: >-
      A restore or dependency-audit failure is a required fix, never
      pre-existing or unrelated: edit the manifest with the floor-pin
      pattern (AUDIT GATE)
    # No setup hook: the deps step (pre-dev) builds .venv-sandbox once per
    # run; goto dev retries re-enter clean, nothing re-installs at step entry.
    # Banned-command deny-list: custom entries append after the engine
    # defaults (git mutations, docker).
    # Releases and GitHub mutations stay operator-only: the loop never
    # publishes itself.
    forbidden_commands:
      - '\btools/publish\.py\b'
      - '\btwine\s+upload\b'
      - '\bgh\s+release\s+create\b'
      - '\bgh\s+pr\s+(create|merge|close)\b'
      - pip install
      - uv add
      - pip-compile
    on_pass: restore

  - name: restore
    # network-on restore step (open bootstrap) + audit escalation: pip-audit
    # fails the step on a known-CVE pin. Under `open` that failure routes to
    # `dev` like any restore failure; the dev step's custom_prompt and the
    # AUDIT GATE section of sdk_agents/dev.agent.md bind it as a required
    # manifest edit, and the bumped pin is audited again on the next pass, so
    # the loop self-corrects.
    # pip is upgraded first (bootstrap hygiene): the dev image's ensurepip
    # bundles a stale wheel, and pip is not a pyproject pin dev can bump, so
    # the audit would otherwise deadlock on pip's own CVEs. Cheap no-op once
    # current; keeps the audit scoped to project pins only.
    command: .venv-sandbox/bin/python -m pip install --upgrade pip && .venv-sandbox/bin/python -m pip install -e ".[dev]" && .venv-sandbox/bin/python -m pip_audit --skip-editable
    timeout: 600
    network: true
    mounts: [{path: ".", mode: rw}]
    egress: { presets: [package-registries] }   # BR-9: one preset, all toolchains
    on_pass: test
    on_fail: { goto: dev, retry: true }

  - name: test
    command: .venv-sandbox/bin/python -m pytest tests/ -q -m "not docker"   # sandboxed: exit code is the verdict
    timeout: 600
    mounts: [{path: ".", mode: rw}]
    on_pass: review
    on_fail: { goto: dev, retry: true }

  - name: review
    agent: review
    reasoning_effort: xhigh
    artifact: review-findings.md
    verdicts: { pass: APPROVED, fail: NEEDS CHANGES }
    mounts: [{path: ".", mode: ro}]
    # Banned-command deny-list: custom entries append after the engine
    # defaults (git mutations, docker).
    # Releases and GitHub mutations stay operator-only: the loop never
    # publishes itself.
    forbidden_commands:
      - '\btools/publish\.py\b'
      - '\btwine\s+upload\b'
      - '\bgh\s+release\s+create\b'
      - '\bgh\s+pr\s+(create|merge|close)\b'
      - pip install
      - uv add
      - pip-compile
    on_pass: qa
    on_fail: { goto: dev, retry: true }

  - name: qa
    agent: qa
    reasoning_effort: medium
    artifact: qa-report.md
    verdicts: { pass: PASS, fail: FAIL, unverifiable: UNVERIFIABLE, env: ENV }
    max_iterations: 150
    finalize_nudge_turns: 10           # Provisional: one final-response nudge
    mounts: [{path: ".", mode: ro}]
    # Banned-command deny-list: custom entries append after the engine
    # defaults (git mutations, docker).
    # Releases and GitHub mutations stay operator-only: the loop never
    # publishes itself.
    forbidden_commands:
      - '\btools/publish\.py\b'
      - '\btwine\s+upload\b'
      - '\bgh\s+release\s+create\b'
      - '\bgh\s+pr\s+(create|merge|close)\b'
    on_pass: commit
    on_fail: { goto: dev, retry: true }
    # UNVERIFIABLE moves on like pass (never rewinds, never retries): the run
    # advances while the record (qa-report.md in the run state) carries the
    # list of checks that could not be verified in the sandbox.
    on_unverifiable: commit
    # ENV is deliberately unset: a broken verification harness halts the run
    # with a report (step_verdicts records `env`, last-error.md carries the
    # blocker list, and the qa-report.md final response holds the evidence).
    # Set `on_env: failure` (or a step) only if a consumer wants to override
    # the default halt-with-report semantics.

  - name: commit
    action: commit
    params: { message: "feat: construct {subject} (agent dev loop)" }
    on_pass: success
