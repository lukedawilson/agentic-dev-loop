name: agentic-dev-loop-construction

extensions:
  - agentic_dev_loop.engine.extensions.aidlc:AidlcExtension   # bundled; loading IS choosing

additional_files:
  - ../README.md                                              # resolved relative to the pipeline file's dir;
                                                              # listed-but-missing → fail fast
  - ../coding-standards-ddd.yaml                              # resolved relative to pipeline file's dir
  - ../AGENTS.md                                              # (agentic-dev-loop/) → repo root
  - ../aidlc-docs/domain-model-erd.md                         # project domain model (aidlc-docs)
  - ../CHANGELOG.md                                           # release history for the code under change (unit-5 egress entries)
  - ../docs/known-issues.md                                   # known container-lifecycle issues touching isolation.py

llm:
  model: openai/deepseek-v4-pro
  base_url: https://api.deepseek.com
  api_key_env: OPENAI_API_KEY
  # timeout omitted → opinionated no-timeout default

max_attempts: 10                     # CLI --max-attempts overrides
agents_dir: sdk_agents               # resolved relative to the pipeline file's dir
# Supply-chain dial: this repo's dogfood loop still runs the bootstrap
# protocol (its restore step is an open install; no committed lockfile yet -
# the consumer repos migrate to `locked` once a committed lockfile exists).
# `open` keeps the original restore behavior verbatim.
deps_policy: open
# Concurrent-edit merge: the aidlc audit log is append-only and edited by
# both the loop (AI-DLC mandates audit.md logging) and the operator - union-merge
# those edits instead of raising a sync-back conflict.
merge_on_conflict: [aidlc-docs/audit.md]
# Venv-boundary enforcement: keep the container-built sandbox venv OUT of
# the workspace - it is bind-mounted in from this host dir at
# {ws}/.venv-sandbox (rw), so `git add -A` sees no venv noise and the host
# `.venv` stays masked (read-only empty tmpfs) from the sandbox.
isolation:
  sandbox_venv_dir: ~/.agentic-dev-loop/venvs/agent-engine

steps:
  - name: brief
    agent: brief
    produces: attempt-brief.md            # run-scoped: created once, reused every attempt
    max_iterations: 12
    # Per-run context digestion: a closed input list (resolved relative to
    # the workspace root) plus the stable environment facts the brief agent
    # must never discover by running commands. The resolved unit/plan docs and
    # additional_files (../README.md) arrive through the loader context.
    brief_inputs:
      include: [AGENTS.md, coding-standards-ddd.yaml]
      env_facts:
        - the workspace is an export with no .git; verify with find/ls, never git status
        - the sandbox is network-off by default; never run package-manager fetches
        - Python packages resolve from .venv-sandbox; run .venv-sandbox/bin/python
    # Banned-command deny-list: custom entries append after the engine
    # defaults (git mutations, package installs, playwright, docker).
    # Releases and GitHub mutations stay operator-only: the loop never
    # publishes itself.
    forbidden_commands:
      - '\btools/publish\.py\b'
      - '\btwine\s+upload\b'
      - '\bgh\s+release\s+create\b'
      - '\bgh\s+pr\s+(create|merge|close)\b'
    on_pass: dev

  - name: dev
    agent: dev
    max_iterations: 100        # 035: turn cap; hard outer bound against verification spirals
    finalize_nudge_turns: 10   # 035: one advisory "produce your final response now" turn at max_iterations - 10
    produces: implementation-summary.md   # hygiene-tracked, no verdict
    mounts: [{path: ".", mode: rw}]        # strict-by-default (Q4): declared, not implied
    # Banned-command deny-list: custom entries append after the engine
    # defaults (git mutations, package installs, playwright, docker).
    # Releases and GitHub mutations stay operator-only: the loop never
    # publishes itself.
    forbidden_commands:
      - '\btools/publish\.py\b'
      - '\btwine\s+upload\b'
      - '\bgh\s+release\s+create\b'
      - '\bgh\s+pr\s+(create|merge|close)\b'
    on_pass: restore

  - name: restore
    # network-on restore step (open bootstrap) + audit escalation: pip-audit
    # fails the step on a known-CVE pin. Under `open` that failure routes to
    # `dev` like any restore failure - dev can bump the pin, and the bumped
    # pin is audited again on the next pass, so the loop self-corrects.
    # pip is upgraded first (bootstrap hygiene): the dev image's ensurepip
    # bundles a stale wheel, and pip is not a pyproject pin dev can bump, so
    # the audit would otherwise deadlock on pip's own CVEs. Cheap no-op once
    # current; keeps the audit scoped to project pins only.
    command: .venv-sandbox/bin/python -m pip install --upgrade pip && .venv-sandbox/bin/python -m pip install -e ".[dev]" && .venv-sandbox/bin/python -m pip_audit --skip-editable
    timeout: 600
    network: true
    mounts: [{path: ".", mode: rw}]
    egress: { presets: [package-registries] }   # BR-9: one preset, all toolchains
    on_pass: test
    on_fail: { goto: dev, retry: true }

  - name: test
    command: .venv-sandbox/bin/python -m pytest tests/ -q -m "not docker"   # sandboxed: exit code is the verdict
    setup: |-
      { [ -x .venv-sandbox/bin/python ] && .venv-sandbox/bin/python -c 'import sys' ; } || { rm -rf .venv-sandbox/* && python -m venv .venv-sandbox ; } && .venv-sandbox/bin/python -m pip install -e ".[dev]"
    timeout: 600
    mounts: [{path: ".", mode: rw}]
    on_pass: review
    on_fail: { goto: dev, retry: true }

  - name: review
    agent: review
    artifact: review-findings.md
    verdicts: { pass: APPROVED, fail: NEEDS CHANGES }
    mounts: [{path: ".", mode: ro}]
    # Banned-command deny-list: custom entries append after the engine
    # defaults (git mutations, package installs, playwright, docker).
    # Releases and GitHub mutations stay operator-only: the loop never
    # publishes itself.
    forbidden_commands:
      - '\btools/publish\.py\b'
      - '\btwine\s+upload\b'
      - '\bgh\s+release\s+create\b'
      - '\bgh\s+pr\s+(create|merge|close)\b'
    on_pass: qa
    on_fail: { goto: dev, retry: true }

  - name: qa
    agent: qa
    artifact: qa-report.md
    verdicts: { pass: PASS, fail: FAIL, unverifiable: UNVERIFIABLE, env: ENV }
    max_iterations: 100
    finalize_nudge_turns: 10           # Provisional: one final-response nudge
    mounts: [{path: ".", mode: ro}]
    # Banned-command deny-list: custom entries append after the engine
    # defaults (git mutations, package installs, playwright, docker).
    # Releases and GitHub mutations stay operator-only: the loop never
    # publishes itself.
    forbidden_commands:
      - '\btools/publish\.py\b'
      - '\btwine\s+upload\b'
      - '\bgh\s+release\s+create\b'
      - '\bgh\s+pr\s+(create|merge|close)\b'
    on_pass: commit
    on_fail: { goto: dev, retry: true }
    # UNVERIFIABLE moves on like pass (never rewinds, never retries): the run
    # advances while the record (qa-report.md in the run state) carries the
    # list of checks that could not be verified in the sandbox.
    on_unverifiable: commit
    # ENV is deliberately unset: a broken verification harness halts the run
    # with a report (step_verdicts records `env`, last-error.md carries the
    # blocker list, and the qa-report.md final response holds the evidence).
    # Set `on_env: failure` (or a step) only if a consumer wants to override
    # the default halt-with-report semantics.

  - name: commit
    action: commit
    params: { message: "feat: construct {subject} (agent dev loop)" }
    on_pass: success
