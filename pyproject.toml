[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dev-loop"
version = "1.0.0a42"
description = "Turn an LLM into a gated, sandboxed, resumable construction loop over your codebase."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Luke Wilson" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "openhands-sdk ~=1.17.0",
    "openhands-tools ~=1.17.0",
    # openhands-sdk declares agent-client-protocol>=0.8.1 with NO upper bound;
    # the 1.0.0rc pre-releases drop acp.helpers (breaks sdk 1.17.0 imports).
    # Without this cap, --pre installs resolve to the broken rc. See AGENTS.md
    # error-handling rules + COMPAT-SHIMS.md for the SDK-compat pattern.
    "agent-client-protocol<1.0.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    # filelock is a transitive dep (openhands-sdk, litellm, virtualenv).
    # 3.32.7 carries CVE-2026-112907/-112913/-112940 (fixed in 4.2.1); pin a
    # floor so the restore step's pip-audit stays green.
    "filelock>=4.2.1",
    # pyasn1 is a transitive dep (openhands-sdk, rsa, google-auth). 0.6.4
    # carries CVE-2026-119194/-119195/-119196/-119197 (fixed in 0.6.5); pin a
    # floor so the restore step's pip-audit stays green.
    "pyasn1>=0.6.5",
    # pypdf is a transitive dep (openhands-tools document loaders). 6.21.2
    # carries CVE-2026-119203/-119204/-119205/-119206/-119207/-119208/-119209
    # (fixed in 6.21.4); pin a floor so the restore step's pip-audit stays green.
    "pypdf>=6.21.4",
]

[project.urls]
Homepage = "https://github.com/lukedawilson/agentic-dev-loop"

[project.scripts]
agentic-dev-loop = "agentic_dev_loop.engine.cli:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.0",
    "pip-audit>=2.0",
    "pre-commit>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_dev_loop = ["py.typed"]
"agentic_dev_loop.engine" = ["*.md"]
"agentic_dev_loop.engine.seccomp" = ["*.json"]

[tool.pytest.ini_options]
markers = [
    "docker: real-Docker integration tests (require a running Linux daemon)",
]
